<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNow - Mi Perfil</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background-color: #ffffff;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            font-size: 16px;
            color: #6b2c91;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.08s;
            box-shadow: 0 1px 0 rgba(0,0,0,0.02), inset 0 1px 0 rgba(255,255,255,0.6);
        }

        .back-button i {
            color: inherit;
            font-size: 18px;
            line-height: 1;
        }

        .back-button:visited {
            color: #6b2c91;
        }

        .back-button:hover {
            background-color: #ffffff;
            color: #5a1f78;
            border-color: rgba(107,44,145,0.12);
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            color: #2c3e50;
            margin-bottom: 50px;
        }

        .content {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .section {
            flex: 1;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section h2 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .photo-container {
            width: 120px;
            height: 120px;
            background-color: #d3d3d3;
            margin: 0 auto 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .change-photo {
            padding: 8px 16px;
            background-color: #9e9e9e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 auto 30px;
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #ececec;
            border-radius: 6px;
            padding: 8px 12px;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #5b9cf5;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            padding: 0;
            transition: color 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            color: #2c3e50;
        }

        .input-wrapper input:readonly {
            color: #6c757d;
        }

        .input-wrapper input:disabled {
            color: #6c757d;
        }

        .edit-icon {
            color: #999;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
            flex-shrink: 0;
        }

        .edit-icon:hover {
            color: #5b9cf5;
        }

        .button-primary {
            width: 100%;
            padding: 15px;
            background-color: #5b9cf5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }

        .button-primary:hover {
            background-color: #4a8ae4;
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 5px 0;
        }

        .toggle-label {
            font-size: 15px;
            color: #555;
            flex: 1;
            margin-right: 15px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
            background-color: #ccc;
            border-radius: 13px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .toggle.active {
            background-color: #5b9cf5;
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle.active .toggle-slider {
            transform: translateX(24px);
        }

        .button-secondary {
            width: 100%;
            padding: 15px;
            background-color: white;
            color: #5b9cf5;
            border: 2px solid #5b9cf5;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .button-secondary:hover {
            background-color: #f0f7ff;
        }

        .button-logout {
            width: 100%;
            padding: 14px;
            background-color: #b91c1c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button-logout:hover {
            background-color: #991b1b;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="main.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            Volver
        </a>

        <h1>Mi Perfil</h1>

        <div class="content">
            <!-- Información Personal -->
            <div class="section">
                <h2>Información Personal</h2>
                
                <div class="photo-container" id="fotoPerfil">
                    <i class="fas fa-user" style="font-size: 3rem; color: #adb5bd;"></i>
                </div>
                <button class="change-photo" onclick="cambiarFoto()">Cambiar Foto</button>
                <input type="file" id="inputFoto" accept="image/*" style="display: none;">

                <div class="form-group">
                    <label for="nombreCompleto">Nombre Completo</label>
                    <div class="input-wrapper">
                        <input type="text" id="nombreCompleto" readonly>
                        <i class="fas fa-edit edit-icon" onclick="editarCampo('nombreCompleto')"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="correoElectronico">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="correoElectronico" readonly>
                        <i class="fas fa-edit edit-icon" onclick="editarCampo('correoElectronico')"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="numeroTelefono">Número de Teléfono</label>
                    <div class="input-wrapper">
                        <input type="tel" id="numeroTelefono" readonly>
                        <i class="fas fa-edit edit-icon" onclick="editarCampo('numeroTelefono')"></i>
                    </div>
                </div>
            </div>

            <!-- Detalles Adicionales y Seguridad -->
            <div class="section">
                <h2>Detalles Adicionales y Seguridad</h2>

                <div class="form-group">
                    <label for="tipoDocumento">Tipo de Documento</label>
                    <div class="input-wrapper">
                        <input type="text" id="tipoDocumento" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="numeroDocumento">Número de Documento</label>
                    <div class="input-wrapper">
                        <input type="text" id="numeroDocumento" readonly>
                        <i class="fas fa-edit edit-icon" onclick="editarCampo('numeroDocumento')"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <div class="input-wrapper">
                        <input type="text" id="direccion" placeholder="Ingresa tu dirección" readonly>
                        <i class="fas fa-edit edit-icon" onclick="editarCampo('direccion')"></i>
                    </div>
                </div>

                <button class="button-primary" onclick="guardarCambios()">Editar Perfil</button>
                <button class="button-secondary" onclick="cambiarPassword()">Cambiar Contraseña</button>
            </div>

            <!-- Preferencias -->
            <div class="section">
                <h2>Preferencias</h2>

                <div class="toggle-container">
                    <span class="toggle-label">Recibir Notificaciones por Correo Electrónico</span>
                    <div class="toggle" onclick="toggleSwitch(this)">
                        <div class="toggle-slider"></div>
                        <input type="checkbox" id="notificaciones" checked style="display: none;">
                    </div>
                </div>

                <div class="toggle-container">
                    <span class="toggle-label">Mostrar promociones</span>
                    <div class="toggle" onclick="toggleSwitch(this)">
                        <div class="toggle-slider"></div>
                        <input type="checkbox" id="promociones" checked style="display: none;">
                    </div>
                </div>

                <button class="button-secondary" onclick="irMetodoPago()" style="margin-top: 30px;">Método de Pago</button>
                <button class="button-secondary" onclick="irMisPedidos()">Mis Pedidos</button>
                <button class="button-logout" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </div>

    <script>
        // Verificar sesión al cargar la página
        window.addEventListener('load', function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (!currentUser) {
                alert('No hay sesión activa. Redirigiendo al inicio.');
                window.location.href = 'main.html';
                return;
            }
            
            // Cargar datos del usuario
            cargarDatosUsuario();
            
            // Cargar foto si existe
            if (currentUser.fotoPerfil) {
                const fotoPerfil = document.getElementById('fotoPerfil');
                fotoPerfil.innerHTML = `<img src="${currentUser.fotoPerfil}" alt="Foto de perfil" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">`;
            }
        });

        function cargarDatosUsuario() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (!currentUser) {
                alert('No hay sesión activa. Redirigiendo al inicio.');
                window.location.href = 'main.html';
                return;
            }

            // Cargar datos en los campos
            document.getElementById('nombreCompleto').value = currentUser.nombreCompleto || '';
            document.getElementById('correoElectronico').value = currentUser.email || '';
            document.getElementById('numeroTelefono').value = currentUser.telefono || '';
            document.getElementById('numeroDocumento').value = currentUser.numeroDocumento || '';
            document.getElementById('direccion').value = currentUser.direccion || '';
            
            // Mapear tipo de documento
            const tipoDocTexto = {
                'cedula': 'Cédula de Ciudadanía',
                'cedula_extranjeria': 'Cédula de Extranjería',
                'pasaporte': 'Pasaporte',
                'tarjeta_identidad': 'Tarjeta de Identidad'
            };
            document.getElementById('tipoDocumento').value = tipoDocTexto[currentUser.tipoDocumento] || 'DNI';
            
            // Cargar preferencias
            document.getElementById('notificaciones').checked = currentUser.notificaciones !== false;
            document.getElementById('promociones').checked = currentUser.promociones !== false;
        }

        function editarCampo(campoId) {
            const campo = document.getElementById(campoId);
            const isDisabled = campo.disabled;
            
            if (isDisabled) {
                campo.disabled = false;
                campo.focus();
                campo.style.backgroundColor = 'white';
            } else {
                campo.disabled = true;
                campo.style.backgroundColor = '#f8f9fa';
                guardarCampo(campoId, campo.value);
            }
        }

        function guardarCampo(campoId, valor) {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
            
            // Mapear campos a propiedades del usuario
            const campoMap = {
                'nombreCompleto': 'nombreCompleto',
                'correoElectronico': 'email',
                'numeroTelefono': 'telefono',
                'numeroDocumento': 'numeroDocumento',
                'direccion': 'direccion'
            };
            
            const propiedad = campoMap[campoId];
            if (propiedad) {
                currentUser[propiedad] = valor;
                
                // Actualizar en la lista de usuarios
                const userIndex = usuarios.findIndex(u => u.email === currentUser.email);
                if (userIndex !== -1) {
                    usuarios[userIndex][propiedad] = valor;
                    localStorage.setItem('usuarios', JSON.stringify(usuarios));
                }
                
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
            }
        }

        function guardarCambios() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
            
            // Guardar preferencias
            currentUser.notificaciones = document.getElementById('notificaciones').checked;
            currentUser.promociones = document.getElementById('promociones').checked;
            
            // Actualizar en la lista de usuarios
            const userIndex = usuarios.findIndex(u => u.email === currentUser.email);
            if (userIndex !== -1) {
                usuarios[userIndex] = currentUser;
                localStorage.setItem('usuarios', JSON.stringify(usuarios));
            }
            
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            alert('Cambios guardados exitosamente.');
        }

        function cambiarFoto() {
            document.getElementById('inputFoto').click();
        }

        document.getElementById('inputFoto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const fotoPerfil = document.getElementById('fotoPerfil');
                    fotoPerfil.innerHTML = `<img src="${e.target.result}" alt="Foto de perfil" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">`;
                    
                    // Guardar la foto en localStorage
                    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                    currentUser.fotoPerfil = e.target.result;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                };
                reader.readAsDataURL(file);
            }
        });

        function cambiarPassword() {
            const nuevaPassword = prompt('Ingresa tu nueva contraseña (mínimo 8 caracteres):');
            
            if (nuevaPassword && nuevaPassword.length >= 8) {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
                
                currentUser.password = nuevaPassword;
                
                const userIndex = usuarios.findIndex(u => u.email === currentUser.email);
                if (userIndex !== -1) {
                    usuarios[userIndex].password = nuevaPassword;
                    localStorage.setItem('usuarios', JSON.stringify(usuarios));
                }
                
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                alert('Contraseña actualizada exitosamente.');
            } else if (nuevaPassword !== null) {
                alert('La contraseña debe tener al menos 8 caracteres.');
            }
        }

        function irMetodoPago() {
            alert('Función de Método de Pago - Por implementar');
        }

        function irMisPedidos() {
            alert('Función de Mis Pedidos - Por implementar');
        }

        function toggleSwitch(element) {
            element.classList.toggle('active');
            const checkbox = element.parentElement.querySelector('input[type="checkbox"]');
            checkbox.checked = element.classList.contains('active');
        }

        function cerrarSesion() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                localStorage.removeItem('currentUser');
                window.location.href = 'main.html';
            }
        }

        // Cargar foto de perfil si existe
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser && currentUser.fotoPerfil) {
                const fotoPerfil = document.getElementById('fotoPerfil');
                fotoPerfil.innerHTML = `<img src="${currentUser.fotoPerfil}" alt="Foto de perfil" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">`;
            }
            
            // Inicializar toggles
            const switches = document.querySelectorAll('.toggle');
            switches.forEach(switchEl => {
                const checkbox = switchEl.parentElement.querySelector('input[type="checkbox"]');
                if (checkbox && checkbox.checked) {
                    switchEl.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
