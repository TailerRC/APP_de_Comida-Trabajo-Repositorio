
<div id="login-modal" class="modal">
    <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div class="login-container">
            <div class="login-header">
                <h2>Iniciar Sesión</h2>
                <p>Accede a tu cuenta para continuar</p>
            </div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper password-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="1r@d34" required>
                        <button type="button" class="toggle-password" aria-label="Mostrar/Ocultar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" name="remember">
                        <span>Recordarme</span>
                    </label>
                    <a href="recuperar-password.html" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-btn">Iniciar Sesión</button>
                <div id="login-error" style="color: #ef4444; font-size: 0.9rem; margin-top: 1rem; display: none; text-align: center;"></div>
            </form>

            <div class="divider">o</div>

            <div class="social-login">
                <button type="button" class="social-btn google-btn">
                    <i class="fab fa-google"></i>
                    Continuar con Google
                </button>
                <button type="button" class="social-btn facebook-btn">
                    <i class="fab fa-facebook-f"></i>
                    Continuar con Facebook
                </button>
            </div>

            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="registro.html" class="register-link">Regístrate</a></p>
            </div>
        </div>
    </div>
</div>
