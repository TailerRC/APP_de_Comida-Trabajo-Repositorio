<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNow - Crear Cuenta</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f8fa 0%, #e8f4f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .registro-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            width: 100%;
            max-width: 800px;
            margin: 2rem;
        }

        .registro-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .registro-header h1 {
            font-size: 2rem;
            color: #0d3f54;
            margin-bottom: 0.5rem;
        }

        .registro-header p {
            color: #6b7280;
            font-size: 1rem;
        }

        .registro-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            color: #0d3f54;
            font-size: 0.9rem;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 0 1rem;
            transition: all 0.3s;
            background: white;
        }

        .input-wrapper:focus-within {
            border-color: #17a2b8;
            box-shadow: 0 0 0 3px rgba(23, 162, 184, 0.1);
        }

        .input-wrapper i {
            color: #9ca3af;
            margin-right: 0.8rem;
            font-size: 1rem;
        }

        .input-wrapper input,
        .input-wrapper select {
            flex: 1;
            border: none;
            padding: 0.75rem 0;
            font-size: 0.95rem;
            outline: none;
            background: transparent;
        }

        .input-wrapper select {
            cursor: pointer;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            cursor: pointer;
            color: #6b7280;
            transition: color 0.3s;
            margin-left: 0.8rem;
        }

        .toggle-password:hover {
            color: #1f2937;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.3rem;
            line-height: 1.4;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            margin: 1.5rem 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 0.1rem;
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: #4b5563;
            cursor: pointer;
            line-height: 1.4;
        }

        .checkbox-group a {
            color: #17a2b8;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .registro-btn {
            background: linear-gradient(135deg, #17a2b8 0%, #00d4ff 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(23, 162, 184, 0.3);
            grid-column: 1 / -1;
        }

        .registro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(23, 162, 184, 0.4);
        }

        .registro-btn:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
            font-size: 0.9rem;
            color: #4b5563;
        }

        .login-link a {
            color: #17a2b8;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .registro-container {
                padding: 2rem;
                margin: 1rem;
            }

            .registro-form {
                grid-template-columns: 1fr;
            }

            .registro-header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="registro-container">
        <div class="registro-header">
            <h1>Crear una Cuenta</h1>
            <p>Únete a nuestra comunidad para acceder a todas las funcionalidades.</p>
        </div>

        <form class="registro-form" id="registroForm">
            <div class="form-group">
                <label for="nombreCompleto">Nombre Completo</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" placeholder="Ej: Juan Pérez" required>
                </div>
            </div>

            <div class="form-group">
                <label for="telefono">Número de Teléfono</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper password-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                </div>
                <div class="password-requirements">
                    Debe tener al menos 8 caracteres, incluyendo mayúsculas, minúsculas, números y un símbolo.
                </div>
            </div>

            <div class="form-group">
                <label for="tipoDocumento">Tipo de Documento</label>
                <div class="input-wrapper">
                    <i class="fas fa-id-card"></i>
                    <select id="tipoDocumento" name="tipoDocumento" required>
                        <option value="">Selecciona un tipo...</option>
                        <option value="cedula">Cédula de Ciudadanía</option>
                        <option value="cedula_extranjeria">Cédula de Extranjería</option>
                        <option value="pasaporte">Pasaporte</option>
                        <option value="tarjeta_identidad">Tarjeta de Identidad</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarPassword">Confirmar Contraseña</label>
                <div class="input-wrapper password-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="Repite tu contraseña" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmarPassword')"></i>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="numeroDocumento">Número de Documento</label>
                <div class="input-wrapper">
                    <i class="fas fa-hashtag"></i>
                    <input type="text" id="numeroDocumento" name="numeroDocumento" placeholder="Ej: 1234567890" required>
                </div>
            </div>

            <div class="checkbox-group full-width">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">
                    Acepto los <a href="#" target="_blank">Términos y Condiciones</a> y la <a href="#" target="_blank">Política de Privacidad</a>.
                </label>
            </div>

            <button type="submit" class="registro-btn">Registrarse</button>
        </form>

        <div class="login-link">
            <p>¿Ya tienes una cuenta? <a href="main.html">Inicia Sesión aquí</a></p>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.toggle-password');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmarPassword = document.getElementById('confirmarPassword').value;
            
            if (password !== confirmarPassword) {
                alert('Las contraseñas no coinciden. Por favor, verifica e intenta nuevamente.');
                return;
            }
            
            if (password.length < 8) {
                alert('La contraseña debe tener al menos 8 caracteres.');
                return;
            }
            
            // Guardar datos del usuario en localStorage
            const userData = {
                nombreCompleto: document.getElementById('nombreCompleto').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                tipoDocumento: document.getElementById('tipoDocumento').value,
                numeroDocumento: document.getElementById('numeroDocumento').value,
                password: password, // En producción, nunca guardar passwords en texto plano
                fechaRegistro: new Date().toISOString(),
                notificaciones: true,
                promociones: true
            };
            
            // Obtener usuarios existentes o crear array vacío
            let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
            
            // Verificar si el email ya existe
            if (usuarios.some(user => user.email === userData.email)) {
                alert('Ya existe una cuenta con este correo electrónico.');
                return;
            }
            
            // Agregar nuevo usuario
            usuarios.push(userData);
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            
            // Establecer sesión activa
            localStorage.setItem('currentUser', JSON.stringify(userData));
            
            alert('¡Registro exitoso! Te has registrado correctamente.');
            
            // Redirigir a la página principal después de 1 segundo
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 1000);
        });
    </script>
</body>
</html>
