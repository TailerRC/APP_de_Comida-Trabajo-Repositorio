<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNow - Crear Cuenta</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/css_usuario/registro.css">
</head>
<body>
    <div class="registro-container">
        <div class="registro-header">
            <h1>Crear una Cuenta</h1>
            <p>Únete a nuestra comunidad para acceder a todas las funcionalidades.</p>
        </div>

        <form class="registro-form" id="registroForm">
            <div class="form-group">
                <label for="nombreCompleto">Nombre Completo</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" placeholder="Ej: Juan Pérez" required>
                </div>
            </div>

            <div class="form-group">
                <label for="telefono">Número de Teléfono</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper password-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                </div>
                <div class="password-requirements">
                    Debe tener al menos 8 caracteres, incluyendo mayúsculas, minúsculas, números y un símbolo.
                </div>
            </div>

            <div class="form-group">
                <label for="tipoDocumento">Tipo de Documento</label>
                <div class="input-wrapper">
                    <i class="fas fa-id-card"></i>
                    <select id="tipoDocumento" name="tipoDocumento" required>
                        <option value="">Selecciona un tipo...</option>
                        <option value="cedula">Cédula de Ciudadanía</option>
                        <option value="cedula_extranjeria">Cédula de Extranjería</option>
                        <option value="pasaporte">Pasaporte</option>
                        <option value="tarjeta_identidad">Tarjeta de Identidad</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarPassword">Confirmar Contraseña</label>
                <div class="input-wrapper password-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="Repite tu contraseña" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmarPassword')"></i>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="numeroDocumento">Número de Documento</label>
                <div class="input-wrapper">
                    <i class="fas fa-hashtag"></i>
                    <input type="text" id="numeroDocumento" name="numeroDocumento" placeholder="Ej: 1234567890" required>
                </div>
            </div>

            <div class="checkbox-group full-width">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">
                    Acepto los <a href="#" target="_blank">Términos y Condiciones</a> y la <a href="#" target="_blank">Política de Privacidad</a>.
                </label>
            </div>

            <button type="submit" class="registro-btn">Registrarse</button>
        </form>

        <div class="login-link">
            <p>¿Ya tienes una cuenta? <a href="main.html">Inicia Sesión aquí</a></p>
        </div>
    </div>

    <script src="js/js_usuario/registro.js"></script>
</body>
</html>
